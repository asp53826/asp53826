<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Aaryan Patel — computer science at UGA. Builds machine learning infrastructure from scratch.">
  <defs>
    <pattern id="grid-dark" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#c9d1d9" opacity="0.07"/>
    </pattern>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .sz { font-size: 18px; }
    .sm { font-size: 14px; }
    .ln { opacity: 0; animation: in 0.45s cubic-bezier(0.2, 0.7, 0.3, 1) forwards; }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes in { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .ln { opacity: 1; animation: none; }
      .caret { animation: none; }
    }
  </style>

  <rect width="1200" height="340" rx="12" fill="#0d1117"/>
  <rect width="1200" height="340" rx="12" fill="url(#grid-dark)"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="12" fill="none" stroke="#30363d"/>

  <rect x="1" y="1" width="1198" height="42" rx="12" fill="#010409"/>
  <rect x="1" y="30" width="1198" height="13" fill="#010409"/>
  <line x1="0" y1="43" x2="1200" y2="43" stroke="#30363d"/>
  <circle cx="26" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="22" r="6" fill="#d29922"/>
  <circle cx="66" cy="22" r="6" fill="#3fb950"/>
  <text x="600" y="27" text-anchor="middle" class="mono sm" fill="#7d8590">asp53826 — ~/systems — zsh</text>

  <g class="ln" style="animation-delay:0.15s">
    <text x="40" y="92" class="mono sz" fill="#3fb950">$</text>
    <text x="62" y="92" class="mono sz" fill="#e6edf3">whoami</text>
  </g>
  <g class="ln" style="animation-delay:0.45s"><text x="40" y="122" class="mono sz" fill="#e6edf3">Aaryan Patel <tspan fill="#7d8590">— computer science @ UGA</tspan></text></g>
  <g class="ln" style="animation-delay:0.6s"><text x="40" y="152" class="mono sm" fill="#7d8590">I build the infrastructure under machine learning, from scratch, and then measure it.</text></g>
  <g class="ln" style="animation-delay:0.9s">
    <text x="40" y="196" class="mono sz" fill="#3fb950">$</text>
    <text x="62" y="196" class="mono sz" fill="#e6edf3">ls ~/systems</text>
  </g>
    <g class="ln" style="animation-delay:1.10s"><rect x="40" y="217" width="96" height="24" rx="5" fill="none" stroke="#30363d"/><text x="50" y="234" class="mono sm" fill="#7d8590">vllm-lite</text></g>
    <g class="ln" style="animation-delay:1.16s"><rect x="144" y="217" width="79" height="24" rx="5" fill="none" stroke="#30363d"/><text x="154" y="234" class="mono sm" fill="#7d8590">annlite</text></g>
    <g class="ln" style="animation-delay:1.22s"><rect x="230" y="217" width="104" height="24" rx="5" fill="none" stroke="#30363d"/><text x="240" y="234" class="mono sm" fill="#7d8590">dist-train</text></g>
    <g class="ln" style="animation-delay:1.28s"><rect x="342" y="217" width="129" height="24" rx="5" fill="none" stroke="#30363d"/><text x="352" y="234" class="mono sm" fill="#7d8590">feature-store</text></g>
    <g class="ln" style="animation-delay:1.34s"><rect x="480" y="217" width="87" height="24" rx="5" fill="none" stroke="#30363d"/><text x="490" y="234" class="mono sm" fill="#7d8590">rag-eval</text></g>
    <g class="ln" style="animation-delay:1.40s"><rect x="575" y="217" width="129" height="24" rx="5" fill="none" stroke="#30363d"/><text x="585" y="234" class="mono sm" fill="#7d8590">agent-harness</text></g>
    <g class="ln" style="animation-delay:1.46s"><rect x="712" y="217" width="112" height="24" rx="5" fill="none" stroke="#30363d"/><text x="722" y="234" class="mono sm" fill="#7d8590">codebase-qa</text></g>
    <g class="ln" style="animation-delay:1.52s"><rect x="832" y="217" width="138" height="24" rx="5" fill="none" stroke="#30363d"/><text x="842" y="234" class="mono sm" fill="#7d8590">grammar-decode</text></g>
  <g class="ln" style="animation-delay:1.7s">
    <text x="40" y="276" class="mono sz" fill="#3fb950">$</text>
    <text x="62" y="276" class="mono sz" fill="#e6edf3">pytest -q --all</text>
  </g>
  <g class="ln" style="animation-delay:2.0s"><text x="40" y="306" class="mono sz" fill="#3fb950">488 passed<tspan fill="#7d8590"> across 8 repositories</tspan></text><rect x="392" y="291" width="10" height="20" fill="#56d4dd" class="caret"/></g>
</svg>
