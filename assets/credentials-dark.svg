<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="346" viewBox="0 0 1200 346" role="img" aria-label="Verification badge array: 29 public systems, 947 test functions, 1843 kilobytes of source, 9 languages, four interactive labs, and live CI.">
  <defs>
    <linearGradient id="bg-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050814"/>
      <stop offset=".52" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#0d1628"/>
    </linearGradient>
    <linearGradient id="scan-dark" x1="0" x2="1">
      <stop stop-color="#4de7ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#4de7ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#4de7ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid-dark" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#8da2bf" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .micro { font-size:10px; letter-spacing:1.5px; }
    .value { font-size:34px; font-weight:760; letter-spacing:-1px; }
    .label { font-size:10px; letter-spacing:1.25px; }
    .chip-text { font-size:10px; font-weight:650; letter-spacing:.45px; }
    .card,.chip { animation:enter .65s cubic-bezier(.18,.78,.28,1) backwards; }
    .pulse { animation:pulse 2.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
    .meter { animation:meter .9s cubic-bezier(.16,.84,.34,1) backwards; transform-box:fill-box; transform-origin:left center; }
    .scanner { animation:scanline 7s ease-in-out infinite; }
    @keyframes enter { from { transform:translateY(8px); } }
    @keyframes pulse { 0%,100% { opacity:.35; transform:scale(.8); } 50% { opacity:1; transform:scale(1.25); } }
    @keyframes meter { from { transform:scaleX(0); } }
    @keyframes scanline { 0%,100% { transform:translateX(-220px); opacity:0; } 12%,88% { opacity:.8; } 100% { transform:translateX(1300px); } }
    @media (prefers-reduced-motion: reduce) {
      .card,.chip,.pulse,.meter { animation:none; } .scanner { display:none; }
    }
  </style>
  <rect width="1200" height="346" rx="16" fill="url(#bg-dark)"/>
  <rect width="1200" height="346" rx="16" fill="url(#grid-dark)"/>
  <rect x=".75" y=".75" width="1198.5" height="344.5" rx="15.25" fill="none" stroke="#20314d" stroke-width="1.5"/>

