<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 554" width="1200" height="554" role="img" aria-label="Measured speedups against named baselines across seven systems">
<defs>
<linearGradient id="sheen-light" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#007d9d" stop-opacity="0"/><stop offset=".5" stop-color="#007d9d" stop-opacity=".55"/><stop offset="1" stop-color="#007d9d" stop-opacity="0"/></linearGradient>
<linearGradient id="vign-light" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef5ff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
<linearGradient id="bar-cyan-light" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#007d9d" stop-opacity=".30"/><stop offset="1" stop-color="#007d9d" stop-opacity="1"/></linearGradient>
<linearGradient id="bar-blue-light" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#145fe0" stop-opacity=".30"/><stop offset="1" stop-color="#145fe0" stop-opacity="1"/></linearGradient>
<linearGradient id="bar-violet-light" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7048d7" stop-opacity=".30"/><stop offset="1" stop-color="#7048d7" stop-opacity="1"/></linearGradient>
<linearGradient id="bar-amber-light" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9b6400" stop-opacity=".30"/><stop offset="1" stop-color="#9b6400" stop-opacity="1"/></linearGradient>
<linearGradient id="bar-green-light" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#087a4c" stop-opacity=".30"/><stop offset="1" stop-color="#087a4c" stop-opacity="1"/></linearGradient>
<filter id="glow-light" x="-40%" y="-70%" width="180%" height="240%"><feGaussianBlur stdDeviation="4.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
    .bar { transform-origin: 272px 0;
            animation: grow 1.15s cubic-bezier(.16,.84,.34,1) backwards; }
    .fade { animation: fade .7s ease-out backwards; }
    .sweep { animation: sweep 5.5s ease-in-out infinite; }
    .tick-line { stroke-dasharray: 3 6; }
    .pip { animation: pip 2.6s ease-in-out infinite; }
    @keyframes grow { from { transform: scaleX(0); } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes sweep {
      0%   { transform: translateX(-140px); opacity: 0; }
      12%  { opacity: .85; }
      88%  { opacity: .85; }
      100% { transform: translateX(1200px); opacity: 0; }
    }
    @keyframes pip { 0%,100% { opacity:.35; } 50% { opacity:1; } }
    @media (prefers-reduced-motion: reduce) {
      .bar, .fade, .pip { animation: none !important; }
      .sweep { display: none; }
    }
    </style>
<rect width="1200" height="554" rx="16" fill="url(#vign-light)"/>
<rect x=".5" y=".5" width="1199" height="553" rx="16" fill="none" stroke="#c4d5ea"/>
<text x="44" y="52" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="700" fill="#0b1730" letter-spacing=".5">MEASURED AGAINST A BASELINE</text>
<text x="44" y="76" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#526a88">every bar is a ratio over the baseline named on its right — log axis, because the range spans two decades</text>
<circle class="pip" cx="1060" cy="46" r="4" fill="#087a4c"/>
<text x="1074" y="50" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#526a88">REPRODUCIBLE</text>
