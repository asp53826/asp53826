<svg xmlns="http://www.w3.org/2000/svg" width="570" height="224" viewBox="0 0 570 224" role="img" aria-label="EDGAR MCP: Identity resolution, filing windows, cache validation, global pacing.">

  <defs>
    <linearGradient id="card-edgar-mcp-light-panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F3F8F8"/><stop offset=".62" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E7F1F2"/>
    </linearGradient>
    <pattern id="card-edgar-mcp-light-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#B9CCD0" stroke-opacity=".24"/>
    </pattern>
    <filter id="card-edgar-mcp-light-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .display { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .utility { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .packet { stroke-dasharray: 4 15; animation: packet 4.8s linear infinite; }
    .packet.return { animation-direction: reverse; animation-duration: 7s; }
    .sweep { animation: sweep 5.5s ease-in-out infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: instrument-pulse 2.6s ease-in-out infinite; }
    .boot { opacity:1; transform:none; animation:boot .55s cubic-bezier(.2,.8,.2,1) backwards; }
    .b2 { animation-delay:.12s; } .b3 { animation-delay:.24s; } .b4 { animation-delay:.36s; }
    @keyframes packet { to { stroke-dashoffset:-190; } }
    @keyframes sweep { 0%,100% { transform:translateX(-140px); opacity:0; } 20%,80% { opacity:.12; } 50% { transform:translateX(1240px); opacity:.04; } }
    @keyframes instrument-pulse { 0%,100% { opacity:.5; transform:scale(.82); } 50% { opacity:1; transform:scale(1.18); } }
    @keyframes boot { from { opacity:0; transform:translateY(7px); } }
    @media (prefers-reduced-motion: reduce) {
      .packet,.sweep,.pulse,.boot { animation:none; } .boot { opacity:1; transform:none; } .sweep { display:none; }
    }
  </style>
  <rect width="570" height="224" rx="12" fill="url(#card-edgar-mcp-light-panel)"/>
  <rect width="570" height="224" rx="12" fill="url(#card-edgar-mcp-light-grid)"/>
  <rect x="1" y="1" width="568" height="222" rx="11" fill="none" stroke="#B9CCD0"/>
  <rect x="0" y="0" width="6" height="224" rx="3" fill="#6546C6"/>
  <text x="28" y="34" class="utility" font-size="10" letter-spacing="1.6" fill="#6546C6">D-04 // BOUNDED FINANCIAL DATA</text>
  <text x="28" y="84" class="display" font-size="30" font-weight="780" letter-spacing="-1" fill="#10242B">EDGAR MCP</text>
  <text x="28" y="113" class="utility" font-size="11" fill="#536A72">Identity resolution, filing windows, cache validation, global pacing.</text>
  <rect x="28" y="139" width="514" height="42" rx="6" fill="#FFFFFF" stroke="#B9CCD0"/>
  <circle cx="47" cy="160" r="5" fill="#6546C6"/><circle cx="47" cy="160" r="11" fill="none" stroke="#6546C6" class="pulse"/>
  <text x="67" y="165" class="utility" font-size="10" letter-spacing=".5" fill="#10242B">32 TESTS  /  138× WARM READ  /  10 REQ/S CEILING</text>
  <text x="28" y="207" class="utility" font-size="9" letter-spacing="1.3" fill="#536A72">OPEN LIVE PROOF  →</text>
  <path d="M412 205H540" stroke="#6546C6" stroke-width="2" class="packet"/>
</svg>
