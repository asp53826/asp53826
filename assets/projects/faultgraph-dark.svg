<svg xmlns="http://www.w3.org/2000/svg" width="570" height="224" viewBox="0 0 570 224" role="img" aria-label="FaultGraph: causal incident analysis, evidence ranking, and counterfactual replay.">
  <defs>
    <linearGradient id="faultgraph-dark-panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071319"/><stop offset=".62" stop-color="#0D2028"/><stop offset="1" stop-color="#102B34"/></linearGradient>
    <pattern id="faultgraph-dark-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#25424B" stroke-opacity=".24"/></pattern>
  </defs>
  <style>
    .display{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.utility{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.packet{stroke-dasharray:4 15;animation:packet 4.8s linear infinite}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}@keyframes packet{to{stroke-dashoffset:-190}}@keyframes pulse{0%,100%{opacity:.5;transform:scale(.82)}50%{opacity:1;transform:scale(1.18)}}@media(prefers-reduced-motion:reduce){.packet,.pulse{animation:none}}
  </style>
  <rect width="570" height="224" rx="12" fill="url(#faultgraph-dark-panel)"/><rect width="570" height="224" rx="12" fill="url(#faultgraph-dark-grid)"/><rect x="1" y="1" width="568" height="222" rx="11" fill="none" stroke="#25424B"/><rect width="6" height="224" rx="3" fill="#72E4DA"/>
  <text x="28" y="34" class="utility" font-size="10" letter-spacing="1.6" fill="#72E4DA">F-07 // CAUSAL INCIDENT WORKBENCH</text>
  <text x="28" y="84" class="display" font-size="30" font-weight="780" letter-spacing="-1" fill="#D8E5E8">FAULTGRAPH</text>
  <text x="28" y="113" class="utility" font-size="11" fill="#789098">Rank evidence, replay hypotheses, and run bounded interventions.</text>
  <rect x="28" y="139" width="514" height="42" rx="6" fill="#0D2028" stroke="#25424B"/><circle cx="47" cy="160" r="5" fill="#72E4DA"/><circle cx="47" cy="160" r="11" fill="none" stroke="#72E4DA" class="pulse"/>
  <text x="67" y="165" class="utility" font-size="10" letter-spacing=".5" fill="#D8E5E8">REPLAY / COUNTERFACTUAL / CHECKSUM LEDGER</text>
  <text x="28" y="207" class="utility" font-size="9" letter-spacing="1.3" fill="#789098">INSPECT THE SYSTEM  →</text><path d="M412 205H540" stroke="#72E4DA" stroke-width="2" class="packet"/>
</svg>
