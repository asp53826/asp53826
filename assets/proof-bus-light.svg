<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="265" viewBox="0 0 1200 265" role="img" aria-label="Verification bus from claim through attack, oracle, boundary, and signed receipt.">

  <defs>
    <linearGradient id="bus-light-panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F3F8F8"/><stop offset=".62" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E7F1F2"/>
    </linearGradient>
    <pattern id="bus-light-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#B9CCD0" stroke-opacity=".24"/>
    </pattern>
    <filter id="bus-light-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .display { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .utility { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .packet { stroke-dasharray: 4 15; animation: packet 4.8s linear infinite; }
    .packet.return { animation-direction: reverse; animation-duration: 7s; }
    .sweep { animation: sweep 5.5s ease-in-out infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: instrument-pulse 2.6s ease-in-out infinite; }
    .boot { opacity:1; transform:none; animation:boot .55s cubic-bezier(.2,.8,.2,1) backwards; }
    .b2 { animation-delay:.12s; } .b3 { animation-delay:.24s; } .b4 { animation-delay:.36s; }
    @keyframes packet { to { stroke-dashoffset:-190; } }
    @keyframes sweep { 0%,100% { transform:translateX(-140px); opacity:0; } 20%,80% { opacity:.12; } 50% { transform:translateX(1240px); opacity:.04; } }
    @keyframes instrument-pulse { 0%,100% { opacity:.5; transform:scale(.82); } 50% { opacity:1; transform:scale(1.18); } }
    @keyframes boot { from { opacity:0; transform:translateY(7px); } }
    @media (prefers-reduced-motion: reduce) {
      .packet,.sweep,.pulse,.boot { animation:none; } .boot { opacity:1; transform:none; } .sweep { display:none; }
    }
  </style>
  <rect width="1200" height="265" rx="16" fill="url(#bus-light-panel)"/><rect width="1200" height="265" rx="16" fill="url(#bus-light-grid)"/>
  <rect x="1" y="1" width="1198" height="263" rx="15" fill="none" stroke="#B9CCD0"/>
  <text x="18" y="32" class="utility" font-size="10" letter-spacing="2" fill="#536A72">VERIFICATION BUS // EVERY PUBLIC CLAIM PASSES ALL FIVE GATES</text>
  <path d="M100 140H1100" stroke="#B9CCD0" stroke-width="4"/>
  <path d="M100 140H1100" stroke="#087C78" stroke-width="3" class="packet"/>

    <g class="boot b1">
      <rect x="18" y="82" width="164" height="116" rx="8" fill="#FFFFFF" stroke="#B9CCD0"/>
      <text x="40" y="111" class="utility" font-size="10" fill="#087C78">01</text>
      <text x="40" y="145" class="display" font-size="17" font-weight="720" letter-spacing=".4" fill="#10242B">CLAIM</text>
      <text x="40" y="171" class="utility" font-size="9" fill="#536A72">Name the invariant</text>
      <circle cx="156" cy="106" r="5" fill="#087C78"/><circle cx="156" cy="106" r="11" fill="none" stroke="#087C78" class="pulse"/>
    </g>
    <g class="boot b2">
      <rect x="243" y="82" width="164" height="116" rx="8" fill="#FFFFFF" stroke="#B9CCD0"/>
      <text x="265" y="111" class="utility" font-size="10" fill="#C52F4B">02</text>
      <text x="265" y="145" class="display" font-size="17" font-weight="720" letter-spacing=".4" fill="#10242B">ATTACK</text>
      <text x="265" y="171" class="utility" font-size="9" fill="#536A72">Break the assumption</text>
      <circle cx="381" cy="106" r="5" fill="#C52F4B"/><circle cx="381" cy="106" r="11" fill="none" stroke="#C52F4B" class="pulse"/>
    </g>
    <g class="boot b3">
      <rect x="468" y="82" width="164" height="116" rx="8" fill="#FFFFFF" stroke="#B9CCD0"/>
      <text x="490" y="111" class="utility" font-size="10" fill="#9A5700">03</text>
      <text x="490" y="145" class="display" font-size="17" font-weight="720" letter-spacing=".4" fill="#10242B">ORACLE</text>
      <text x="490" y="171" class="utility" font-size="9" fill="#536A72">Decide pass or fail</text>
      <circle cx="606" cy="106" r="5" fill="#9A5700"/><circle cx="606" cy="106" r="11" fill="none" stroke="#9A5700" class="pulse"/>
    </g>
    <g class="boot b4">
      <rect x="693" y="82" width="164" height="116" rx="8" fill="#FFFFFF" stroke="#B9CCD0"/>
      <text x="715" y="111" class="utility" font-size="10" fill="#6546C6">04</text>
      <text x="715" y="145" class="display" font-size="17" font-weight="720" letter-spacing=".4" fill="#10242B">BOUNDARY</text>
      <text x="715" y="171" class="utility" font-size="9" fill="#536A72">Publish the losing regime</text>
      <circle cx="831" cy="106" r="5" fill="#6546C6"/><circle cx="831" cy="106" r="11" fill="none" stroke="#6546C6" class="pulse"/>
    </g>
    <g class="boot b4">
      <rect x="918" y="82" width="164" height="116" rx="8" fill="#FFFFFF" stroke="#B9CCD0"/>
      <text x="940" y="111" class="utility" font-size="10" fill="#167A43">05</text>
      <text x="940" y="145" class="display" font-size="17" font-weight="720" letter-spacing=".4" fill="#10242B">RECEIPT</text>
      <text x="940" y="171" class="utility" font-size="9" fill="#536A72">Bind source and artifact</text>
      <circle cx="1056" cy="106" r="5" fill="#167A43"/><circle cx="1056" cy="106" r="11" fill="none" stroke="#167A43" class="pulse"/>
    </g>
  <text x="600" y="238" text-anchor="middle" class="utility" font-size="10" letter-spacing="1.3" fill="#536A72">SOURCE → TEST → LIMITATION → DIGEST → REPRODUCIBLE COMMAND</text>
</svg>
