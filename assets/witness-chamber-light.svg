<svg xmlns="http://www.w3.org/2000/svg" width="1168" height="230" viewBox="0 0 1168 230" role="img" aria-label="WITNESS live reproducibility chamber: eight receipt-bound capsules execute in the browser.">
  <defs><linearGradient id="wl-panel" x1="0" x2="1"><stop stop-color="#F5FAF7"/><stop offset="1" stop-color="#E8F2ED"/></linearGradient><pattern id="wl-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#557267" stroke-opacity=".15"/></pattern></defs>
  <style>.d{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.scan{animation:wl-scan 4s linear infinite}.dash{stroke-dasharray:5 12;animation:wl-dash 6s linear infinite}@keyframes wl-scan{from{transform:translateX(-80px)}to{transform:translateX(1230px)}}@keyframes wl-dash{to{stroke-dashoffset:-170}}@media(prefers-reduced-motion:reduce){.scan,.dash{animation:none}.scan{display:none}}</style>
  <rect width="1168" height="230" rx="12" fill="url(#wl-panel)"/><rect width="1168" height="230" rx="12" fill="url(#wl-grid)"/><rect x="1" y="1" width="1166" height="228" rx="11" fill="none" stroke="#9AB2A8"/><g class="scan" opacity=".35"><rect width="2" height="230" fill="#08784B"/><rect x="2" width="50" height="230" fill="#08784B" opacity=".06"/></g>
  <text x="30" y="38" class="m" font-size="10" letter-spacing="2" fill="#08784B">W-01 // LIVE REPRODUCIBILITY CHAMBER</text><text x="30" y="89" class="d" font-size="39" font-weight="780" letter-spacing="-1.5" fill="#10231C">WITNESS</text><text x="30" y="118" class="m" font-size="11" fill="#50665D">Verify the receipt. Execute the pinned code. Inspect the measured trace.</text>
  <g transform="translate(30 146)"><rect width="470" height="52" fill="#F8FCFA" stroke="#9AB2A8"/><circle cx="24" cy="26" r="5" fill="#08784B"/><text x="42" y="23" class="m" font-size="9" letter-spacing="1" fill="#50665D">LOCAL EXECUTION</text><text x="42" y="39" class="m" font-size="11" font-weight="700" fill="#10231C">8 CAPSULES  /  8 PINNED COMMITS  /  0 MOCKS</text></g>
  <g transform="translate(548 36)"><path d="M0 78H566" stroke="#9AB2A8" class="dash"/>
    <g><rect width="128" height="84" fill="#F8FCFA" stroke="#9AB2A8"/><text x="14" y="21" class="m" font-size="8" letter-spacing="1.2" fill="#16707A">01–02 / SYSTEMS + ML</text><text x="14" y="47" class="m" font-size="11" font-weight="700" fill="#10231C">WASM / TS</text><text x="14" y="67" class="m" font-size="8" fill="#50665D">RAFT · SHAPES</text></g>
    <g transform="translate(146)"><rect width="128" height="84" fill="#F8FCFA" stroke="#9AB2A8"/><text x="14" y="21" class="m" font-size="8" letter-spacing="1.2" fill="#16707A">03–04 / AUTO + QUANT</text><text x="14" y="47" class="m" font-size="11" font-weight="700" fill="#10231C">PYODIDE ×2</text><text x="14" y="67" class="m" font-size="8" fill="#50665D">CLUTTER · RISK</text></g>
    <g transform="translate(292)"><rect width="128" height="84" fill="#F8FCFA" stroke="#9AB2A8"/><text x="14" y="21" class="m" font-size="8" letter-spacing="1.2" fill="#16707A">05–06 / SEARCH + SAR</text><text x="14" y="47" class="m" font-size="11" font-weight="700" fill="#10231C">WASM / PY</text><text x="14" y="67" class="m" font-size="8" fill="#50665D">RECALL · FOCUS</text></g>
    <g transform="translate(438)"><rect width="128" height="84" fill="#F8FCFA" stroke="#08784B"/><text x="14" y="21" class="m" font-size="8" letter-spacing="1.2" fill="#08784B">07–08 / VIO + AAD</text><text x="14" y="47" class="m" font-size="11" font-weight="700" fill="#10231C">PYODIDE ×2</text><text x="14" y="67" class="m" font-size="8" fill="#50665D">PARALLAX · DELTA</text></g>
    <g transform="translate(0 110)"><text y="18" class="m" font-size="9" letter-spacing="1.4" fill="#50665D">RECEIPT SHA-256</text><path d="M124 14H438" stroke="#9AB2A8"/><circle cx="454" cy="14" r="7" fill="#08784B"/><text x="474" y="18" class="m" font-size="10" font-weight="700" fill="#08784B">INVARIANT HELD</text></g>
  </g><text x="1032" y="213" class="m" font-size="9" letter-spacing="1.5" fill="#08784B">EXECUTE →</text>
</svg>
