<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="48" viewBox="0 0 1200 48" role="img" aria-label="Divider: packets cross a five-node bus; one is dropped and its retry gets through">
  <defs><linearGradient id="dvc-light-fade" x1="0" x2="1"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".12" stop-color="#fff"/><stop offset=".88" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><mask id="dvc-light-mask"><rect width="1200" height="48" fill="url(#dvc-light-fade)"/></mask><filter id="dvc-light-glow" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="2.5"/></filter></defs>
  <style>.display{font-family:Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif}.utility{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}.fb{transform-box:fill-box}.pk,.xm{opacity:0}.pk{transform-box:fill-box;transform-origin:center}.nd{transform-origin:center;animation:dvcnd 2.4s ease-in-out infinite}@keyframes dvcnd{0%,100%{opacity:.55}50%{opacity:1}}@keyframes dvc0{0.000%{opacity:0}36.750%{opacity:0}36.765%{opacity:1}50.000%{opacity:1}54.412%{opacity:0}100.000%{opacity:0}}@keyframes dvc1{0.000%{opacity:0;transform:translate(0px,0)}2.926%{opacity:0;transform:translate(0px,0)}2.941%{opacity:1;transform:translate(0px,0)}47.059%{opacity:1;transform:translate(1000px,0)}48.824%{opacity:0;transform:translate(1000px,0)}100.000%{opacity:0}}@keyframes dvc2{0.000%{opacity:0;transform:translate(0px,0)}14.691%{opacity:0;transform:translate(0px,0)}14.706%{opacity:1;transform:translate(0px,0)}36.765%{opacity:1;transform:translate(500px,0)}38.529%{opacity:1;transform:translate(500px,0) rotate(0deg)}47.059%{opacity:0;transform:translate(508px,16px) rotate(70deg)}100.000%{opacity:0}}@keyframes dvc3{0.000%{opacity:0;transform:translate(0px,0)}44.103%{opacity:0;transform:translate(0px,0)}44.118%{opacity:1;transform:translate(0px,0)}88.235%{opacity:1;transform:translate(1000px,0)}90.000%{opacity:0;transform:translate(1000px,0)}100.000%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
  <g mask="url(#dvc-light-mask)">
    <path d="M30 24H1170" stroke="#B9CCD0" stroke-width="2"/>
    <g class="pk" style="animation:dvc1 6.8s linear infinite"><rect x="92" y="20" width="16" height="8" rx="2.5" fill="#087C78"/></g><g class="pk" style="animation:dvc2 6.8s linear infinite"><rect x="92" y="20" width="16" height="8" rx="2.5" fill="#C52F4B"/></g><g class="pk" style="animation:dvc3 6.8s linear infinite"><rect x="92" y="20" width="16" height="8" rx="2.5" fill="#167A43"/></g>
    <circle cx="100" cy="24" r="6" fill="#FFFFFF" stroke="#087C78" stroke-width="1.5" class="nd fb" style="animation-delay:0s"/><circle cx="350" cy="24" r="6" fill="#FFFFFF" stroke="#087C78" stroke-width="1.5" class="nd fb" style="animation-delay:-0.4s"/><circle cx="600" cy="24" r="6" fill="#FFFFFF" stroke="#087C78" stroke-width="1.5" class="nd fb" style="animation-delay:-0.8s"/><circle cx="850" cy="24" r="6" fill="#FFFFFF" stroke="#087C78" stroke-width="1.5" class="nd fb" style="animation-delay:-1.2s"/><circle cx="1100" cy="24" r="6" fill="#FFFFFF" stroke="#087C78" stroke-width="1.5" class="nd fb" style="animation-delay:-1.6s"/>
    <text x="600" y="13" text-anchor="middle" class="utility xm" font-size="9" font-weight="700" fill="#C52F4B" style="animation:dvc0 6.8s linear infinite">× DROP → RETRY</text>
  </g>
</svg>
