      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="signal-light" x1="0" x2="1">
      <stop stop-color="#007d9d" stop-opacity="0"/>
      <stop offset=".48" stop-color="#007d9d" stop-opacity=".72"/>
      <stop offset="1" stop-color="#087a4c" stop-opacity="0"/>
