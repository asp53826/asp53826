<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="486" viewBox="0 0 1200 486" role="img" aria-label="Execution matrix of 21 source-backed technologies: C++17, Python, SQL, Bash, Git, GNU Make, Docker, GitHub Actions, pytest, sanitizers, DRAT-trim, CaDiCaL, HTTPX, GitHub Pages, NumPy, SciPy, PyTorch, FAISS, FastAPI, SQLite, and MCP.">
