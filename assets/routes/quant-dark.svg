<svg xmlns="http://www.w3.org/2000/svg" width="280" height="82" viewBox="0 0 280 82" role="img" aria-label="Open QUANT recruiter route.">

  <defs>
    <linearGradient id="route-quant-dark-panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#071319"/><stop offset=".62" stop-color="#0D2028"/><stop offset="1" stop-color="#102B34"/>
    </linearGradient>
    <pattern id="route-quant-dark-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#25424B" stroke-opacity=".24"/>
    </pattern>
    <filter id="route-quant-dark-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>.display{font-family:Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif}.utility{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}.signal{stroke-dasharray:4 10;animation:route 4s linear infinite}@keyframes route{to{stroke-dashoffset:-112}}@media(prefers-reduced-motion:reduce){.signal{animation:none}}</style>
  <rect width="280" height="82" rx="9" fill="url(#route-quant-dark-panel)"/><rect x="1" y="1" width="278" height="80" rx="8" fill="none" stroke="#25424B"/>
  <circle cx="23" cy="24" r="5" fill="#72E4DA"/><text x="39" y="29" class="display" font-size="15" font-weight="720" fill="#D8E5E8">QUANT</text>
  <text x="23" y="54" class="utility" font-size="8.5" letter-spacing=".4" fill="#789098">EDGAR · MARKETS · ADJOINTS</text>
  <path d="M204 63H257" stroke="#72E4DA" stroke-width="2" class="signal"/><path d="M250 57L258 63L250 69" fill="none" stroke="#72E4DA" stroke-width="2"/>
</svg>
