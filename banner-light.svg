<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Aaryan Patel verification instrument for systems and machine learning infrastructure.">

  <defs>
    <linearGradient id="hero-light-panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F3F8F8"/><stop offset=".62" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E7F1F2"/>
    </linearGradient>
    <pattern id="hero-light-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#B9CCD0" stroke-opacity=".24"/>
    </pattern>
    <filter id="hero-light-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .display { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .utility { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .packet { stroke-dasharray: 4 15; animation: packet 4.8s linear infinite; }
    .packet.return { animation-direction: reverse; animation-duration: 7s; }
    .sweep { animation: sweep 5.5s ease-in-out infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: instrument-pulse 2.6s ease-in-out infinite; }
    .boot { opacity:1; transform:none; animation:boot .55s cubic-bezier(.2,.8,.2,1) backwards; }
    .b2 { animation-delay:.12s; } .b3 { animation-delay:.24s; } .b4 { animation-delay:.36s; }
    @keyframes packet { to { stroke-dashoffset:-190; } }
    @keyframes sweep { 0%,100% { transform:translateX(-140px); opacity:0; } 20%,80% { opacity:.12; } 50% { transform:translateX(1240px); opacity:.04; } }
    @keyframes instrument-pulse { 0%,100% { opacity:.5; transform:scale(.82); } 50% { opacity:1; transform:scale(1.18); } }
    @keyframes boot { from { opacity:0; transform:translateY(7px); } }
    @media (prefers-reduced-motion: reduce) {
      .packet,.sweep,.pulse,.boot { animation:none; } .boot { opacity:1; transform:none; } .sweep { display:none; }
    }
  </style>
  <rect width="1200" height="440" rx="18" fill="url(#hero-light-panel)"/>
  <rect width="1200" height="440" rx="18" fill="url(#hero-light-grid)"/>
  <rect x="1" y="1" width="1198" height="438" rx="17" fill="none" stroke="#B9CCD0"/>
  <rect width="1200" height="44" rx="18" fill="#FFFFFF" fill-opacity=".86"/>
  <path d="M0 44H1200" stroke="#B9CCD0"/>
  <circle cx="22" cy="22" r="4" fill="#C52F4B"/><circle cx="38" cy="22" r="4" fill="#9A5700"/><circle cx="54" cy="22" r="4" fill="#167A43"/>
  <text x="76" y="27" class="utility" font-size="11" letter-spacing="2" fill="#536A72">EVIDENCE INSTRUMENT // AP-26</text>
  <text x="1168" y="27" text-anchor="end" class="utility" font-size="10" letter-spacing="1.3" fill="#167A43">VERIFIABLE</text>

  <g class="boot">
    <text x="50" y="102" class="utility" font-size="11" letter-spacing="3" fill="#087C78">SYSTEMS + ML INFRASTRUCTURE</text>
    <text x="50" y="174" class="display" font-size="62" font-weight="780" letter-spacing="-3" fill="#10242B">AARYAN PATEL</text>
    <text x="50" y="210" class="utility" font-size="14" fill="#10242B">C++ · Python · distributed systems · databases · GPU compilers</text>
    <text x="50" y="238" class="utility" font-size="12" fill="#536A72">Build the mechanism. Attack the assumption. Publish where it loses.</text>
  </g>

  <path d="M554 221H1144" fill="none" stroke="#B9CCD0" stroke-width="2"/>
  <path d="M554 221H1144" fill="none" stroke="#087C78" stroke-width="3" class="packet"/>

      <g class="boot b1">
        <rect x="565" y="190" width="94" height="62" rx="7" fill="#FFFFFF" stroke="#B9CCD0"/>
        <circle cx="612" cy="210" r="5" fill="#087C78"/><circle cx="612" cy="210" r="11" fill="none" stroke="#087C78" class="pulse"/>
        <text x="612" y="235" text-anchor="middle" class="utility" font-size="10" letter-spacing="1.2" fill="#10242B">CLAIM</text>
      </g>
      <g class="boot b2">
        <rect x="685" y="190" width="94" height="62" rx="7" fill="#FFFFFF" stroke="#B9CCD0"/>
        <circle cx="732" cy="210" r="5" fill="#C52F4B"/><circle cx="732" cy="210" r="11" fill="none" stroke="#C52F4B" class="pulse"/>
        <text x="732" y="235" text-anchor="middle" class="utility" font-size="10" letter-spacing="1.2" fill="#10242B">ATTACK</text>
      </g>
      <g class="boot b3">
        <rect x="805" y="190" width="94" height="62" rx="7" fill="#FFFFFF" stroke="#B9CCD0"/>
        <circle cx="852" cy="210" r="5" fill="#9A5700"/><circle cx="852" cy="210" r="11" fill="none" stroke="#9A5700" class="pulse"/>
        <text x="852" y="235" text-anchor="middle" class="utility" font-size="10" letter-spacing="1.2" fill="#10242B">ORACLE</text>
      </g>
      <g class="boot b4">
        <rect x="925" y="190" width="94" height="62" rx="7" fill="#FFFFFF" stroke="#B9CCD0"/>
        <circle cx="972" cy="210" r="5" fill="#6546C6"/><circle cx="972" cy="210" r="11" fill="none" stroke="#6546C6" class="pulse"/>
        <text x="972" y="235" text-anchor="middle" class="utility" font-size="10" letter-spacing="1.2" fill="#10242B">BOUNDARY</text>
      </g>
      <g class="boot b4">
        <rect x="1045" y="190" width="94" height="62" rx="7" fill="#FFFFFF" stroke="#B9CCD0"/>
        <circle cx="1092" cy="210" r="5" fill="#167A43"/><circle cx="1092" cy="210" r="11" fill="none" stroke="#167A43" class="pulse"/>
        <text x="1092" y="235" text-anchor="middle" class="utility" font-size="10" letter-spacing="1.2" fill="#10242B">RECEIPT</text>
      </g>

  <g class="boot b3">
    <rect x="50" y="292" width="1100" height="105" rx="10" fill="#FFFFFF" fill-opacity=".9" stroke="#B9CCD0"/>
    <path d="M306 307V382M562 307V382M818 307V382" stroke="#B9CCD0"/>
    <text x="76" y="335" class="utility" font-size="24" font-weight="700" fill="#087C78">27</text>
    <text x="76" y="360" class="utility" font-size="10" letter-spacing="1.4" fill="#536A72">PUBLIC SYSTEMS</text>
    <text x="332" y="335" class="utility" font-size="24" font-weight="700" fill="#167A43">895</text>
    <text x="332" y="360" class="utility" font-size="10" letter-spacing="1.4" fill="#536A72">TEST FUNCTIONS</text>
    <text x="588" y="335" class="utility" font-size="24" font-weight="700" fill="#9A5700">1,671 KB</text>
    <text x="588" y="360" class="utility" font-size="10" letter-spacing="1.4" fill="#536A72">MEASURED SOURCE</text>
    <text x="844" y="335" class="utility" font-size="24" font-weight="700" fill="#6546C6">4 ROUTES</text>
    <text x="844" y="360" class="utility" font-size="10" letter-spacing="1.4" fill="#536A72">ROLE-SPECIFIC ENTRY</text>
  </g>
  <rect x="-140" y="0" width="120" height="440" fill="#087C78" class="sweep"/>
</svg>
