<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="368" viewBox="0 0 1200 368" role="img" aria-label="Aaryan Patel — computer science at UGA. Builds machine learning infrastructure from scratch.">
  <defs>
    <pattern id="grid-light" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1f2328" opacity="0.07"/>
    </pattern>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .sz { font-size: 18px; }
    .sm { font-size: 14px; }
    .ln { opacity: 0; animation: in 0.45s cubic-bezier(0.2, 0.7, 0.3, 1) forwards; }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes in { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .ln { opacity: 1; animation: none; }
      .caret { animation: none; }
    }
  </style>

  <rect width="1200" height="368" rx="12" fill="#ffffff"/>
  <rect width="1200" height="368" rx="12" fill="url(#grid-light)"/>
  <rect x="0.5" y="0.5" width="1199" height="367" rx="12" fill="none" stroke="#d1d9e0"/>

  <rect x="1" y="1" width="1198" height="42" rx="12" fill="#f6f8fa"/>
  <rect x="1" y="30" width="1198" height="13" fill="#f6f8fa"/>
  <line x1="0" y1="43" x2="1200" y2="43" stroke="#d1d9e0"/>
  <circle cx="26" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="22" r="6" fill="#9a6700"/>
  <circle cx="66" cy="22" r="6" fill="#1a7f37"/>
  <text x="600" y="27" text-anchor="middle" class="mono sm" fill="#59636e">asp53826 — ~/systems — zsh</text>

  <g class="ln" style="animation-delay:0.15s">
    <text x="40" y="92" class="mono sz" fill="#1a7f37">$</text>
    <text x="62" y="92" class="mono sz" fill="#1f2328">whoami</text>
  </g>
  <g class="ln" style="animation-delay:0.45s"><text x="40" y="122" class="mono sz" fill="#1f2328">Aaryan Patel <tspan fill="#59636e">— computer science @ UGA</tspan></text></g>
  <g class="ln" style="animation-delay:0.6s"><text x="40" y="152" class="mono sm" fill="#59636e">I build the infrastructure under machine learning, from scratch, and then measure it.</text></g>
  <g class="ln" style="animation-delay:0.9s">
    <text x="40" y="196" class="mono sz" fill="#1a7f37">$</text>
    <text x="62" y="196" class="mono sz" fill="#1f2328">ls ~/systems</text>
  </g>
    <g class="ln" style="animation-delay:1.10s"><rect x="40" y="217" width="96" height="24" rx="5" fill="none" stroke="#d1d9e0"/><text x="50" y="234" class="mono sm" fill="#59636e">vllm-lite</text></g>
    <g class="ln" style="animation-delay:1.16s"><rect x="144" y="217" width="79" height="24" rx="5" fill="none" stroke="#d1d9e0"/><text x="154" y="234" class="mono sm" fill="#59636e">annlite</text></g>
    <g class="ln" style="animation-delay:1.22s"><rect x="230" y="217" width="104" height="24" rx="5" fill="none" stroke="#d1d9e0"/><text x="240" y="234" class="mono sm" fill="#59636e">dist-train</text></g>
    <g class="ln" style="animation-delay:1.28s"><rect x="342" y="217" width="129" height="24" rx="5" fill="none" stroke="#d1d9e0"/><text x="352" y="234" class="mono sm" fill="#59636e">feature-store</text></g>
    <g class="ln" style="animation-delay:1.34s"><rect x="480" y="217" width="87" height="24" rx="5" fill="none" stroke="#d1d9e0"/><text x="490" y="234" class="mono sm" fill="#59636e">rag-eval</text></g>
    <g class="ln" style="animation-delay:1.40s"><rect x="575" y="217" width="129" height="24" rx="5" fill="none" stroke="#d1d9e0"/><text x="585" y="234" class="mono sm" fill="#59636e">agent-harness</text></g>
    <g class="ln" style="animation-delay:1.46s"><rect x="712" y="217" width="112" height="24" rx="5" fill="none" stroke="#d1d9e0"/><text x="722" y="234" class="mono sm" fill="#59636e">codebase-qa</text></g>
    <g class="ln" style="animation-delay:1.52s"><rect x="832" y="217" width="138" height="24" rx="5" fill="none" stroke="#d1d9e0"/><text x="842" y="234" class="mono sm" fill="#59636e">grammar-decode</text></g>
    <g class="ln" style="animation-delay:1.58s"><rect x="978" y="217" width="121" height="24" rx="5" fill="none" stroke="#d1d9e0"/><text x="988" y="234" class="mono sm" fill="#59636e">track-fusion</text></g>
    <g class="ln" style="animation-delay:1.64s"><rect x="40" y="245" width="121" height="24" rx="5" fill="none" stroke="#d1d9e0"/><text x="50" y="262" class="mono sm" fill="#59636e">sdr-receiver</text></g>
    <g class="ln" style="animation-delay:1.70s"><rect x="169" y="245" width="96" height="24" rx="5" fill="none" stroke="#d1d9e0"/><text x="179" y="262" class="mono sm" fill="#59636e">sar-focus</text></g>
  <g class="ln" style="animation-delay:1.7s">
    <text x="40" y="304" class="mono sz" fill="#1a7f37">$</text>
    <text x="62" y="304" class="mono sz" fill="#1f2328">pytest -q --all</text>
  </g>
  <g class="ln" style="animation-delay:2.0s"><text x="40" y="334" class="mono sz" fill="#1a7f37">602 passed<tspan fill="#59636e"> across 11 repositories</tspan></text><rect x="402" y="319" width="10" height="20" fill="#0550ae" class="caret"/></g>
</svg>
